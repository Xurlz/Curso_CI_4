name: CD

on: workflow_call

jobs:
  ECS:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id:      ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:             'sa-east-1'

      - name: Get ECS Task Definition
        run: |
          aws ecs describe-task-definition \
          --task-definition task-ci-cd-practice \
          --query taskDefinition > task-definition.json

      - name: Fill in the new image ID with the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: task-ci-cd-practice-app
          image: |-
            ghcr.io/xurlz/go_ci:${{ case(
              github.event_name == 'pull_request', github.head_ref,
              github.ref_name
            ) }}
          environment-variables: |
            HOST=${{ secrets.DB_HOST }}
            USER=${{ secrets.DB_USER }}
            PASSWORD=${{ secrets.DB_PASSWORD }}
            DBNAME=${{ secrets.DB_NAME }}
            DBPORT=${{ secrets.DB_PORT }}
            PORT=8000

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            task-definition.json
          service:                    service-task-ci-cd-practice
          cluster:                    cluster-ci-cd-practice
          wait-for-service-stability: true

